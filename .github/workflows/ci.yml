name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Check Python syntax
        run: python3 -m py_compile scripts/*.py
      
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
  
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trainia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trainia_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Enable corepack
        run: corepack enable
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Lint
        run: pnpm lint
      
      - name: Typecheck
        run: pnpm typecheck
      
      - name: Test
        run: pnpm test
      
      - name: Run migrations
        run: pnpm --filter @trainia/api db:migrate
      
      - name: Seed database (first run)
        run: pnpm --filter @trainia/api db:seed
      
      - name: Seed database (second run - idempotency check)
        run: pnpm --filter @trainia/api db:seed
      
      - name: Run integration tests with Firebase Auth Emulator
        run: firebase emulators:exec --only auth --project demo-trainia "pnpm --filter @trainia/api test:integration && pnpm --filter @trainia/mobile test:integration"
        env:
          FIREBASE_PROJECT_ID: demo-trainia
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          EXPO_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          ADMIN_EMAILS: admin@test.local
      
      - name: Generate migrations (drift check)
        run: pnpm --filter @trainia/api db:generate
      
      - name: Check for schema drift
        run: |
          git diff --exit-code apps/api/src/db/migrations/
          if [ -n "$(git status --porcelain apps/api/src/db/migrations/)" ]; then
            echo "Error: Untracked or modified files found in migrations/"
            git status apps/api/src/db/migrations/
            exit 1
          fi
