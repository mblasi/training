services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: trainia
      POSTGRES_PASSWORD: trainia_dev_password
      POSTGRES_DB: trainia_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainia"]
      interval: 10s
      timeout: 5s
      retries: 5
